[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers
asyncio_default_fixture_loop_scope = function
markers =
    slow: marks tests as slow
    live_llm: real-model integration tests (deselected unless RUN_LLM_LIVE=1)
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
