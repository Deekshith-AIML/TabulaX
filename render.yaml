# Render Blueprint — TabulaX backend (free tier, ₹0/month).
#
# Deploy: push this repo to GitHub, then Render → New → Blueprint → pick repo.
# Render reads this file and provisions a free Python web service.
#
# Required one-time setup (Dashboard → Environment):
#   MONGODB_URL   = your MongoDB Atlas connection string (mongodb+srv://...)
#   CORS_ORIGINS  = your Vercel frontend origin, e.g. https://<project>.vercel.app
#   OPENAI_API_KEY = leave EMPTY for the free no-LLM configuration
# SECRET_KEY is auto-generated by Render and persisted (no need to set it).

services:
  - type: web
    name: tabulax-api
    runtime: python
    plan: free
    buildCommand: cd tabula/backend && pip install --no-cache-dir -r requirements.txt
    startCommand: cd tabula/backend && uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_NAME
        value: tabula
      # MongoDB Atlas connection string — set this in the Render dashboard.
      - key: MONGODB_URL
        sync: false
      # Comma-separated allowed frontend origins — set in the Render dashboard.
      - key: CORS_ORIGINS
        sync: false
      # Auto-generated and persisted by Render across deploys.
      - key: SECRET_KEY
        generateValue: true
      # Optional AI assistant. Leave empty for the free, no-LLM mode.
      - key: OPENAI_API_KEY
        sync: false
      # Optional tuning (defaults shown). Lower these on the 512 MB free plan
      # if you ever see out-of-memory kills:
      - key: SANDBOX_MEMORY_LIMIT_MB
        value: "256"
      - key: SESSION_TTL_MINUTES
        value: "720"
